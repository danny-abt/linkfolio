<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="20" fill="#0c1117"/>
  <!-- Lueur orange ciel haut-droite -->
  <circle cx="78" cy="20" r="22" fill="#c07030" opacity="0.28"/>
  <!-- Chaîne de montagnes fond -->
  <polygon points="0,80 20,48 38,60 58,28 76,48 90,36 100,44 100,100 0,100" fill="#2a404f"/>
  <!-- Couche de nuages/brume -->
  <ellipse cx="45" cy="76" rx="52" ry="13" fill="#0c1117" opacity="0.75"/>
  <!-- Mer -->
  <rect x="0" y="72" width="100" height="28" fill="#18303f" opacity="0.9"/>
  <!-- Reflet lumineux eau -->
  <rect x="55" y="72" width="45" height="3" fill="#8fa8b8" opacity="0.25"/>
</svg>
